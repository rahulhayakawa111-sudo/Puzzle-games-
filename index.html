<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Puzzle Battle</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#111827;
    color:white;
}

.container{
    max-width:520px;
    margin:auto;
    padding:18px;
}

h1{text-align:center}

.card{
    background:#1f2937;
    padding:16px;
    border-radius:16px;
    margin-bottom:15px;
}

input,button,select{
    width:100%;
    padding:13px;
    margin:6px 0;
    border-radius:10px;
    border:0;
    font-size:16px;
}

button{
    background:#2563eb;
    color:white;
    font-weight:bold;
}

.mode{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
}

.mode button{
    background:#374151;
}

.mode button.selected{
    background:#16a34a;
}

.status{
    text-align:center;
    font-weight:bold;
}

.player{
    background:#374151;
    padding:9px;
    border-radius:8px;
    margin:5px 0;
}

.chat{
    height:180px;
    overflow-y:auto;
    background:#111827;
    padding:10px;
    border-radius:10px;
}

.msg{
    margin:7px 0;
}

#roomArea,#gameArea{
    display:none;
}

.score{
    display:flex;
    justify-content:space-between;
    font-size:18px;
}

.question{
    font-size:21px;
    text-align:center;
    margin:20px 0;
}

#roomCode{
    font-size:24px;
    text-align:center;
    font-weight:bold;
    letter-spacing:3px;
}
</style>
</head>

<body>

<div class="container">

<h1>🧩 PUZZLE BATTLE</h1>

<!-- GAME MENU -->
<div class="card" id="menu">

<h2>🎮 Game Mode</h2>

<div class="mode">
    <button id="m1" onclick="selectMode('1v1')">1v1</button>
    <button id="m2" onclick="selectMode('2v2')">2v2</button>
    <button id="m3" onclick="selectMode('4v4')">4v4</button>
</div>

<p id="modeInfo">Select a mode</p>

<input id="name" placeholder="Enter your name">

<button onclick="createRoom()">➕ CREATE ROOM</button><button onclick="startOffline()">🎮 OFFLINE PLAY</button>

<input id="joinCode" placeholder="Enter room code">

<button onclick="joinRoom()">🚪 JOIN ROOM</button>

<p class="status" id="status">🔴 Connecting...</p>

</div>


<!-- OFFLINE GAME -->
<div class="card" id="offlineArea" style="display:none">
<h2>🎮 Offline Puzzle</h2>
<h3>🧩 Level <span id="offlineLevel">1</span> / 10</h3>
<div class="score">
<span>⭐ Score: <b id="offlineScore">0</b></span>
<span>⏱️ <b id="offlineTimer">30</b>s</span>
</div>
<div class="question" id="offlineQuestion"></div>
<div id="offlineOptions"></div>
<p id="offlineResult"></p>
<button onclick="offlineNext()">➡️ NEXT LEVEL</button>
<button onclick="offlineBack()">⬅️ BACK TO MENU</button>
</div>
<!-- ROOM -->
<div class="card" id="roomArea">

<h2>🏠 Room</h2>

<div id="roomCode"></div>

<p id="roomMode"></p>

<h3>👥 Players</h3>

<div id="players">Waiting...</div>

<button onclick="startGame()">▶️ START GAME</button>

</div>


<!-- GAME -->
<div class="card" id="gameArea">

<h2>🎮 Level <span id="level">1</span></h2>

<div class="score">
<span>⭐ Score: <b id="score">0</b></span>
<span>⏱️ <b id="timer">30</b>s</span>
</div>

<div class="question">
What has keys but cannot open locks?
</div>

<input id="answer" placeholder="Your answer">

<button onclick="checkAnswer()">✅ SUBMIT</button>

<p id="result"></p>

</div>


<!-- CHAT -->
<div class="card">

<h3>💬 Live Chat</h3>

<div class="chat" id="chat"></div>

<input id="message" placeholder="Type message">

<button onclick="sendChat()">SEND</button>

</div>

</div>


<script>

const SERVER = "wss://puzzle-games-5.onrender.com";
let socket;
let selectedMode = "2v2";

let score = 0;
let time = 30;
let timerInterval;


function selectMode(mode){

    selectedMode = mode;

    document.getElementById("m1").classList.remove("selected");
    document.getElementById("m2").classList.remove("selected");
    document.getElementById("m3").classList.remove("selected");

    if(mode === "1v1"){
        document.getElementById("m1").classList.add("selected");
        document.getElementById("modeInfo").innerText =
            "1v1 — 2 players";
    }

    if(mode === "2v2"){
        document.getElementById("m2").classList.add("selected");
        document.getElementById("modeInfo").innerText =
            "2v2 — 4 players";
    }

    if(mode === "4v4"){
        document.getElementById("m3").classList.add("selected");
        document.getElementById("modeInfo").innerText =
            "4v4 — 8 players";
    }
}


selectMode("2v2");


function connect(){

    socket = new WebSocket(SERVER);

    socket.onopen = function(){

        document.getElementById("status").innerText =
            "🟢 Server Connected";
    };


    socket.onclose = function(){

        document.getElementById("status").innerText =
            "🔴 Disconnected — reconnecting...";

        setTimeout(connect,3000);
    };


    socket.onerror = function(){

        document.getElementById("status").innerText =
            "⚠️ Connection problem";
    };


    socket.onmessage = function(event){

        const data = JSON.parse(event.data);


        if(data.type === "room_created"){

            showRoom(
                data.room,
                data.mode,
                data.maxPlayers
            );

            addChat(
                "SYSTEM",
                "Room created: " + data.room
            );
        }


        if(data.type === "joined"){

            showRoom(
                data.room,
                data.mode,
                data.maxPlayers
            );

            addChat(
                "SYSTEM",
                "Joined room: " + data.room
            );
        }


        if(data.type === "room_info"){

            showRoom(
                data.room,
                data.mode,
                data.maxPlayers
            );

            showPlayers(data.players);
        }


        if(data.type === "players"){

            showPlayers(data.players);
        }


        if(data.type === "chat"){

            addChat(
                data.player,
                data.message
            );
        }


if(data.type === "game_start"){

    document.getElementById("gameArea").style.display = "block";

}

if(data.type === "online_question"){

    renderOnlineQuestion(data);

}

if(data.type === "answer_result"){

    document.getElementById("result").innerText =
        data.correct
        ? "✅ Correct! +10 points — " + data.winner
        : "❌ Wrong answer!";

    if(data.scores){

        const myId = socket._playerId;

        if(myId && data.scores[myId] !== undefined){
            document.getElementById("score").innerText =
                data.scores[myId];
        }

    }

}

if(data.type === "question_timeout"){

    document.getElementById("result").innerText =
        "⏰ Time Up! Correct answer: " + data.correctAnswer;

}

if(data.type === "game_finished"){

    document.getElementById("result").innerText =
        "🏆 Game Complete!";

}

function renderOnlineQuestion(data){

    document.getElementById("gameArea").style.display = "block";

    document.getElementById("level").innerText = data.level;

    document.getElementById("timer").innerText = data.time;

    document.querySelector("#gameArea .question").innerText =
        data.question;

    document.getElementById("result").innerText = "";

    document.getElementById("answer").style.display = "none";

    const submitButton =
        document.querySelector('#gameArea button[onclick="checkAnswer()"]');

    if(submitButton){
        submitButton.style.display = "none";
    }

    let oldBox = document.getElementById("onlineOptions");

    if(oldBox){
        oldBox.remove();
    }

    const box = document.createElement("div");

    box.id = "onlineOptions";

    box.style.marginTop = "15px";

    data.options.forEach((option, index) => {

        const button = document.createElement("button");

        button.innerText =
            String.fromCharCode(65 + index) + ") " + option;

        button.style.display = "block";
        button.style.width = "100%";
        button.style.margin = "8px 0";

        button.onclick = function(){

            document
                .querySelectorAll("#onlineOptions button")
                .forEach(b => b.disabled = true);

            socket.send(JSON.stringify({
                type: "answer",
                option: index
            }));

        };

        box.appendChild(button);

    });

    document.getElementById("gameArea").appendChild(box);

    let left = data.time;

    clearInterval(window.onlineTimer);

    window.onlineTimer = setInterval(function(){

        left--;

        document.getElementById("timer").innerText = left;

        if(left <= 0){

            clearInterval(window.onlineTimer);

        }

    },1000);

}
            startLevel();
        }


        if(data.type === "error"){

            alert(data.message);
        }

    };


function createRoom(){

    const name =
        document.getElementById("name").value.trim()
        || "Player";

    if(socket.readyState !== WebSocket.OPEN){

        alert("Server connected nahi hai");

        return;
    }


    socket.send(JSON.stringify({

        type:"create",

        name:name,

        mode:selectedMode

    }));
}


function joinRoom(){

    const name =
        document.getElementById("name").value.trim()
        || "Player";

    const room =
        document.getElementById("joinCode").value.trim();


    if(!room){

        alert("Room code enter karo");

        return;
    }


    if(socket.readyState !== WebSocket.OPEN){

        alert("Server connected nahi hai");

        return;
    }


    socket.send(JSON.stringify({

        type:"join",

        name:name,

        room:room

    }));
}


function showRoom(room,mode,maxPlayers){

    document.getElementById("menu").style.display =
        "none";

    document.getElementById("roomArea").style.display =
        "block";


    document.getElementById("roomCode").innerText =
        room;


    document.getElementById("roomMode").innerText =
        "🎮 " + mode +
        " • " +
        maxPlayers +
        " players required";
}


function showPlayers(players){

    let html = "";

    players.forEach(function(p,index){

        html +=
        '<div class="player">' +
        (index + 1) +
        ". " +
        p.name +
        " — Team " +
        p.team +
        "</div>";

    });


    document.getElementById("players").innerHTML =
        html;
}


function startGame(){

    if(socket.readyState !== WebSocket.OPEN){

        alert("Server connected nahi hai");

        return;
    }


    socket.send(JSON.stringify({

        type:"start"

    }));
}


function startLevel(){

    document.getElementById("gameArea").style.display =
        "block";


    score = 0;
    time = 30;


    document.getElementById("score").innerText =
        score;

    document.getElementById("timer").innerText =
        time;

    document.getElementById("result").innerText = "";

    document.getElementById("answer").value = "";


    clearInterval(timerInterval);


    timerInterval = setInterval(function(){

        time--;

        document.getElementById("timer").innerText =
            time;


        if(time <= 0){

            clearInterval(timerInterval);

            document.getElementById("result").innerText =
                "⏰ Time Up! Answer: Piano";
        }

    },1000);
}


function checkAnswer(){

    const answer =
        document.getElementById("answer")
        .value
        .trim()
        .toLowerCase();


    if(answer === "piano"){

        clearInterval(timerInterval);

        score += 100;


        document.getElementById("score").innerText =
            score;


        document.getElementById("result").innerText =
            "🎉 Correct! +100 points";

    }else{

        document.getElementById("result").innerText =
            "❌ Wrong answer — try again!";
    }
}


function sendChat(){

    const message =
        document.getElementById("message")
        .value
        .trim();


    if(!message) return;


    if(socket.readyState !== WebSocket.OPEN){

        alert("Not connected");

        return;
    }


    socket.send(JSON.stringify({

        type:"chat",

        message:message

    }));


    document.getElementById("message").value = "";
}


function addChat(name,message){

    const chat =
        document.getElementById("chat");


    const div =
        document.createElement("div");


    div.className = "msg";


    div.innerText =
        name + ": " + message;


    chat.appendChild(div);


    chat.scrollTop =
        chat.scrollHeight;
}


document
.getElementById("message")
.addEventListener("keydown",function(e){

    if(e.key === "Enter"){

        sendChat();
    }

});


setTimeout(connect,0);



var offlineQuestions=[
{q:"What has keys but cannot open locks?",options:["Door","Piano","Car","House"],answer:1},
{q:"What has hands but cannot clap?",options:["Clock","Robot","Monkey","Tree"],answer:0},
{q:"What gets wetter as it dries?",options:["Towel","Water","Soap","Sun"],answer:0},
{q:"What has many teeth but cannot bite?",options:["Shark","Comb","Dog","Saw"],answer:1},
{q:"What can travel around the world while staying in one corner?",options:["Stamp","Car","Plane","Clock"],answer:0},
{q:"What has one eye but cannot see?",options:["Needle","Potato","Camera","Bird"],answer:0},
{q:"What has a neck but no head?",options:["Bottle","Shirt","Snake","Tree"],answer:0},
{q:"What goes up but never comes down?",options:["Rain","Age","Ball","Smoke"],answer:1},
{q:"What has legs but cannot walk?",options:["Table","Dog","Human","Horse"],answer:0},
{q:"What has a face and two hands but no arms or legs?",options:["Clock","Book","Chair","Phone"],answer:0}
];
var offlineIndex=0,offlineScoreValue=0,offlineAnswered=false,offlineTimerId=null,offflineTimeLeft=30;
function startOffline(){document.getElementById("menu").style.display="none";document.getElementById("roomArea").style.display="none";document.getElementById("gameArea").style.display="none";document.getElementById("offlineArea").style.display="block";renderOfflineQuestion();}function renderOfflineQuestion(){
    try {
        clearInterval(offlineTimerId);

        offlineAnswered = false;
        offlineTimeLeft = 30;

        const q = offlineQuestions[offlineIndex];

        if (!q) {
            document.getElementById("offlineQuestion").innerText =
                "❌ Question load nahi hua";
            return;
        }

        document.getElementById("offlineLevel").innerText =
            offlineIndex + 1;

        document.getElementById("offlineTimer").innerText = "30";

        document.getElementById("offlineQuestion").innerText =
            q.q;

        document.getElementById("offlineResult").innerText = "";

        const box = document.getElementById("offlineOptions");
        box.innerHTML = "";

        q.options.forEach(function(option, i) {
            const b = document.createElement("button");

            b.innerText =
                String.fromCharCode(65 + i) + ") " + option;

            b.onclick = function() {
                offlineAnswer(i);
            };

            box.appendChild(b);
        });

        offlineTimerId = setInterval(function() {
            offlineTimeLeft--;

            document.getElementById("offlineTimer").innerText =
                offlineTimeLeft;

            if (offlineTimeLeft <= 0) {
                clearInterval(offlineTimerId);

                offlineAnswered = true;

                document.getElementById("offlineResult").innerText =
                    "⏰ Time Up! Correct answer: " +
                    q.options[q.answer];
            }
        }, 1000);

    } catch (error) {
        document.getElementById("offlineQuestion").innerText =
            "❌ Error: " + error.message;
    }
}

function offlineAnswer(selected){if(offlineAnswered)return;offlineAnswered=true;clearInterval(offlineTimerId);const q=offlineQuestions[offlineIndex];if(selected===q.answer){offlineScoreValue+=10;document.getElementById("offlineScore").innerText=offlineScoreValue;document.getElementById("offlineResult").innerText="✅ Correct! +10"}else{document.getElementById("offlineResult").innerText="❌ Wrong! Correct answer: "+q.options[q.answer]}}function offlineNext(){if(!offlineAnswered){document.getElementById("offlineResult").innerText="⚠️ Pehle answer select karo!";return}if(offlineIndex>=offlineQuestions.length-1){document.getElementById("offlineResult").innerText="🏆 Game Complete! Final Score: "+offlineScoreValue;return}offlineIndex++;renderOfflineQuestion()}function offlineBack(){clearInterval(offlineTimerId);document.getElementById("offlineArea").style.display="none";document.getElementById("menu").style.display="block"}</script>

</body>
</html>
